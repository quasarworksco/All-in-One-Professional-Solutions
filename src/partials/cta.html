<section class="band">

  <div class="band__shade"></div>
  <div class="band__content container">
    <p class="label label--light">Tu primera consulta</p>
    <h2 class="band__title" data-split>Cuéntanos <em>tu caso.</em></h2>

      <a class="btn btn--outline magnetic" href="tel:{{site.phoneHref}}"><span class="btn__text">{{site.phone}}</span></a>
    </div>
  </div>
</section>
