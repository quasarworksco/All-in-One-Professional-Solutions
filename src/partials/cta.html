<section class="section section--tight">
  <div class="container">
    <div class="cta on-dark">
      <div class="cta__glow" aria-hidden="true"></div>
      <div class="cta__text">
        <p class="eyebrow eyebrow--light">Tu primera consulta</p>
        <h2>Cuéntanos tu caso. <em>Nosotros nos encargamos.</em></h2>
        <p>En una llamada revisamos tu situación, te decimos qué necesitas y cuánto cuesta. Sin compromiso y sin letra pequeña.</p>
      </div>
      <div class="cta__actions">
        <a class="btn btn--gold btn--lg" href="contacto.html#agenda">Agenda tu consulta <svg class="ic"><use href="#i-arrow"/></svg></a>
        <a class="btn btn--ghost-light btn--lg" href="tel:{{site.phoneHref}}"><svg class="ic"><use href="#i-phone"/></svg>{{site.phone}}</a>
      </div>
    </div>
  </div>
</section>
